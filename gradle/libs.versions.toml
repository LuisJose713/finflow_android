[versions]
agp = "8.5.0"
kotlin = "2.0.0"
ksp = "2.0.0-1.0.21"
composeBom = "2024.09.03"
activityCompose = "1.9.0"
lifecycleRuntimeKtx = "2.8.2"
navigationCompose = "2.7.7"
hilt = "2.51.1"
