name: Android QA APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Security configuration regression checks
        run: python3 scripts/check-security-config.py
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: test -d "$ANDROID_HOME" && "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Make wrapper executable
        run: chmod +x ./gradlew
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Verify APK signing and manifest
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -F "versionCode='5'"
          printf '%s\n' "$BADGING" | grep -F "versionName='1.2.2-finflow'"
          printf '%s\n' "$BADGING" | head -n 12
      - name: Publish APK for QA
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: FinFlow-Android-v1.2.2-finflow-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  android10-install:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Make wrapper executable
        run: chmod +x ./gradlew
      - name: Android 10 emulator install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            ./gradlew --no-daemon assembleDebug
            adb wait-for-device
            # Emulator can report "device online" before PackageManager is ready.
            # Never treat a PackageManager startup race as a failed APK install.
            READY=0
            for i in $(seq 1 70); do
              if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] && \
                 adb shell pm path android 2>/dev/null | grep -q '^package:'; then
                READY=1
                break
              fi
              sleep 3
            done
            test "$READY" = "1" || (echo "Android emulator package manager unavailable" && exit 1)
            adb install -r app/build/outputs/apk/debug/app-debug.apk || \
              (sleep 8 && adb install -r app/build/outputs/apk/debug/app-debug.apk)
            adb shell monkey -p com.softdevcode.finflow_android -c android.intent.category.LAUNCHER 1
